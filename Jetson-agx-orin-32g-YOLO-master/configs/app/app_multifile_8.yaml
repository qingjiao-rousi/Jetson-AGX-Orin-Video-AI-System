app:
  app_name: deepstream-yolov8-multifile-8
  source_count: 8
  enable_web: false

web:
  enabled: false
  host: 127.0.0.1
  port: 8080
  enable_status_api: true
  enable_debug_api: true
  enable_logs_api: true
  refresh_interval_ms: 1000
  log_buffer_size: 200

sources:
  - name: local_video_01
    kind: file
    uri: /home/nvidia/Desktop/YOLO/video/1.mp4
    enabled: true
  - name: local_video_02
    kind: file
    uri: /home/nvidia/Desktop/YOLO/video/2.mp4
    enabled: true
  - name: local_video_03
    kind: file
    uri: /home/nvidia/Desktop/YOLO/video/3.mp4
    enabled: true
  - name: local_video_04
    kind: file
    uri: /home/nvidia/Desktop/YOLO/video/4.mp4
    enabled: true
  - name: local_video_05
    kind: file
    uri: /home/nvidia/Desktop/YOLO/video/5.mp4
    enabled: true
  - name: local_video_06
    kind: file
    uri: /home/nvidia/Desktop/YOLO/video/6.mp4
    enabled: true
  - name: local_video_07
    kind: file
    uri: /home/nvidia/Desktop/YOLO/video/7.mp4
    enabled: true
  - name: local_video_08
    kind: file
    uri: /home/nvidia/Desktop/YOLO/video/8.mp4
    enabled: true

logging:
  level: INFO
  file_path: outputs/multifile_inproc/app.log
  console: true

output:
  jsonl_path: outputs/multifile_inproc/results.jsonl
  enable_jsonl: true
  enable_mqtt: false
  enable_kafka: false
  mqtt_host: 127.0.0.1
  mqtt_port: 1883
  mqtt_topic: deepstream/results

optimization:
  max_queue_size: 32
  fps_min: 5.0
  fps_max: 30.0
  enable_fps_control: false
  enable_backpressure: true

deepstream:
  batch_size: 8
  batched_push_timeout_us: 40000
  inference_width: 640
  inference_height: 640
  enable_tracker: true
  enable_osd: true
  enable_tiler: true
  tiler_rows: 2
  tiler_columns: 4
  tiler_width: 1280
  tiler_height: 720
  output_sink: file
  output_video_path: outputs/multifile_inproc/multifile_preview.mp4
  model_engine_path: models/yolov8s.engine
  custom_lib_path: custom_libs/nvdsinfer_custom_impl_Yolo/libnvdsinfer_custom_impl_Yolo.so
  tracker_config_path: configs/deepstream/tracker_iou.yml
  infer_config_path: configs/deepstream/infer_primary_yolo_minimal.txt
  streammux_config_path: configs/deepstream/streammux.yaml
