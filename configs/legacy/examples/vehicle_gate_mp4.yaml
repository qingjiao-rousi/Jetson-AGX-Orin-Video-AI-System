app:
  app_name: deepstream-yolov8-vehicle-gate-mp4-test
  source_count: 1
  enable_web: false

scenes:
  vehicle_gate:
    description: 车辆出入口
  normal:
    description: 普通监控区

models:
  primary:
    backend: deepstream_nvinfer
    engine: models/yolov8s.engine
  plate_detector:
    backend: tensorrt
    engine: models/plate_detector_fastalpr.engine
    input_width: 384
    input_height: 384
  plate_ocr:
    backend: tensorrt
    engine: models/plate_ocr_fastalpr-dynamic.engine
    config: models/plate_ocr_config.yaml
    input_width: 128
    input_height: 64

model_tasks:
  plate_detector:
    model: plate_detector
    trigger_classes: [car, truck, bus]
    interval: 5
    min_track_frames: 3

capabilities:
  license_plate_recognition:
    tasks: [plate_detector]

sources:
  - name: vehicle_gate_mp4_01
    kind: file
    uri: video/1.mp4
    enabled: true
    scene: vehicle_gate
    priority: high
    capabilities: [license_plate_recognition]

web:
  enabled: false

logging:
  level: INFO
  file_path: outputs/vehicle_gate_mp4_test/app.log
  console: true

output:
  jsonl_path: outputs/vehicle_gate_mp4_test/results.jsonl
  events_jsonl_path: outputs/vehicle_gate_mp4_test/events.jsonl
  metrics_jsonl_path: outputs/vehicle_gate_mp4_test/runtime_metrics.jsonl
  enable_jsonl: true

optimization:
  max_queue_size: 32
  enable_fps_control: false
  enable_backpressure: true

deepstream:
  batch_size: 1
  batched_push_timeout_us: 40000
  inference_width: 1280
  inference_height: 720
  infer_interval: 1
  enable_tracker: true
  enable_osd: true
  enable_tiler: false
  output_sink: file
  output_video_path: outputs/vehicle_gate_mp4_test/output.mp4
  model_engine_path: models/yolov8s.engine
  custom_lib_path: custom_libs/nvdsinfer_custom_impl_Yolo/libnvdsinfer_custom_impl_Yolo.so
  tracker_config_path: configs/deepstream/tracker_iou.yml
  probe_handler_path: build/probe_handler/libprobe_handler.so
  infer_config_path: configs/legacy/infer_primary_yolo.txt
  streammux_config_path: configs/deepstream/streammux.yaml
