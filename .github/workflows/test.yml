name: Unit tests

on:
  push:
    branches: [main, project-finalize]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests/unit -p 'test_*.py' -v
